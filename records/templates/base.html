{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RunLog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="{% url 'top' %}">RunLog</a>
      <nav>
        {% if user.is_authenticated %}
          <a href="{% url 'record_list' %}">記録</a>
          <a href="{% url 'profile' %}">プロフィール</a>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="link-button">ログアウト</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">ログイン</a>
          <a href="{% url 'signup' %}">アカウントを作成</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container-app {% block container_class %}{% endblock %}">
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
